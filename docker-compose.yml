services:
  postgres:
    image: postgres:16-alpine
    container_name: massage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-massage_subscriptions}
      POSTGRES_USER: ${POSTGRES_USER:-massage_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-massage_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-massage_app} -d ${POSTGRES_DB:-massage_subscriptions}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
